name: Diagnose AWS access

# Manual troubleshooting tool. Tries each AWS action the deployment needs, on throwaway resources
# that it deletes again, and reports which are blocked by an AWS Organization (service control
# policy) and which are missing from our own IAM policy. Run it from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Probe the deploy identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    env:
      AWS_REGION: ap-south-1
      STACK_NAME: transaction-webhook-service

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Probe AWS access
        run: bash scripts/diagnose-aws-access.sh
