# Local Postgres for development and integration tests (host port 5433 to avoid clashing with a local install).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transactions
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d transactions']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
