AWSTemplateFormatVersion: '2010-09-09'
Description: >
  One-time setup (create this stack ONCE, by hand, as an admin): gives GitHub Actions a least-privilege
  identity for deploying the transaction-webhook-service stack. Two modes:
    - oidc  (recommended): a role GitHub assumes with short-lived OIDC tokens. NO stored keys.
    - user  (fallback):    an IAM user whose access key you store as GitHub secrets. Use it only where
                           an organization policy forbids OIDC providers.
  The permissions are limited to resources named after the application stack.

Parameters:
  AccessMode:
    Type: String
    Default: user
    AllowedValues: [user, oidc]
    Description: 'user = IAM user with an access key (works when OIDC providers are blocked). oidc = keyless role (preferred if allowed).'
  StackName:
    Type: String
    Default: transaction-webhook-service
    Description: Name of the application stack the pipeline deploys. Must match STACK_NAME in deploy.yml.
  DeployRegion:
    Type: String
    Default: ap-southeast-2
    AllowedPattern: '^[a-z]{2}(-[a-z]+)+-[0-9]$'
    Description: >
      Region the pipeline deploys the application to. Must match AWS_REGION in deploy.yml. The permissions are
      scoped to this region, so it does NOT matter which region you create this access stack in.
  GitHubOwner:
    Type: String
    Default: ''
    Description: 'oidc mode only: GitHub user or organisation that owns the repository (case-sensitive).'
  GitHubRepository:
    Type: String
    Default: ''
    Description: 'oidc mode only: repository name (case-sensitive).'
  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: 'oidc mode only: set to false if this account already has the GitHub OIDC provider (one per account).'
  ExistingOidcProviderArn:
    Type: String
    Default: ''
    Description: 'oidc mode only: required when CreateOidcProvider is false.'

Rules:
  OidcModeNeedsTheRepository:
    RuleCondition: !Equals [!Ref AccessMode, oidc]
    Assertions:
      - Assert: !Not [!Equals [!Ref GitHubOwner, '']]
        AssertDescription: GitHubOwner is required in oidc mode.
      - Assert: !Not [!Equals [!Ref GitHubRepository, '']]
        AssertDescription: GitHubRepository is required in oidc mode.

Conditions:
  UseOidc: !Equals [!Ref AccessMode, oidc]
  UseUser: !Equals [!Ref AccessMode, user]
  ShouldCreateProvider: !And
    - !Equals [!Ref AccessMode, oidc]
    - !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  # ---------------------------------------------------------------- permissions
  # Split in two because a managed policy is limited to 6,144 characters.
  # NOTE: the identities below are deliberately NOT named "<StackName>-*", so the permissions to
  # manage "<StackName>-*" roles can never be turned against the deploy identity itself.
  #
  # NOTE: these permissions match resources by the "<StackName>-" name prefix. CloudFormation
  # SHORTENS auto-generated names that exceed a service's limit (EventBridge rules: 64 characters),
  # which silently breaks the prefix. So application resources with long logical ids must be given
  # explicit names in template.yaml (the two schedule rules are).
  DeployPolicyPlatform:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: !Sub 'Lets the pipeline deploy ${StackName} (CloudFormation, S3 artifacts, Lambda, IAM roles).'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFormationOnOwnStacks
            Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DeleteStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
              - cloudformation:GetTemplate
              - cloudformation:CreateChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:ListStackResources
              - cloudformation:TagResource
            Resource:
              - !Sub 'arn:${AWS::Partition}:cloudformation:${DeployRegion}:${AWS::AccountId}:stack/${StackName}/*'
              # SAM CLI keeps its artifact bucket in this helper stack.
              - !Sub 'arn:${AWS::Partition}:cloudformation:${DeployRegion}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*'

          - Sid: ApplySamTransform
            Effect: Allow
            Action: cloudformation:CreateChangeSet
            Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${DeployRegion}:aws:transform/Serverless-2016-10-31'

          - Sid: CloudFormationReadOnlyNoResourceScope
            Effect: Allow
            Action:
              - cloudformation:GetTemplateSummary
              - cloudformation:ValidateTemplate
              - cloudformation:ListStacks
            Resource: '*'

          - Sid: DeploymentArtifactBucket
            Effect: Allow
            Action: s3:*
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-*'
              - !Sub 'arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-*/*'

          - Sid: LambdaFunctionsOfTheStack
            Effect: Allow
            Action:
              - lambda:CreateFunction
              - lambda:DeleteFunction
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:PublishVersion
              - lambda:TagResource
              - lambda:UntagResource
              - lambda:ListTags
              - lambda:AddPermission
              - lambda:RemovePermission
              - lambda:GetPolicy
              - lambda:CreateFunctionUrlConfig
              - lambda:UpdateFunctionUrlConfig
              - lambda:DeleteFunctionUrlConfig
              - lambda:GetFunctionUrlConfig
              - lambda:PutFunctionConcurrency
              - lambda:DeleteFunctionConcurrency
            Resource: !Sub 'arn:${AWS::Partition}:lambda:${DeployRegion}:${AWS::AccountId}:function:${StackName}-*'

          - Sid: LambdaEventSourceMappings
            # Mapping ARNs are random UUIDs, so they cannot be scoped by name.
            Effect: Allow
            Action:
              - lambda:CreateEventSourceMapping
              - lambda:UpdateEventSourceMapping
              - lambda:DeleteEventSourceMapping
              - lambda:GetEventSourceMapping
              - lambda:ListEventSourceMappings
            Resource: '*'

          - Sid: ManageExecutionRolesOfTheStack
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:UpdateAssumeRolePolicy
              - iam:PutRolePolicy
              - iam:GetRolePolicy
              - iam:DeleteRolePolicy
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
              - iam:TagRole
              - iam:UntagRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackName}-*'

          - Sid: AttachOnlyAwsServiceRolePolicies
            Effect: Allow
            Action:
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackName}-*'
            Condition:
              ArnLike:
                iam:PolicyARN: !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/*'

          - Sid: PassExecutionRolesToLambdaOnly
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackName}-*'
            Condition:
              StringEquals:
                iam:PassedToService: lambda.amazonaws.com

  DeployPolicyResources:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: !Sub 'Lets the pipeline deploy ${StackName} (SQS, schedules, logs, alarms, SNS).'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: QueuesOfTheStack
            Effect: Allow
            Action:
              - sqs:CreateQueue
              - sqs:DeleteQueue
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:SetQueueAttributes
              - sqs:TagQueue
              - sqs:UntagQueue
              - sqs:ListQueueTags
            Resource: !Sub 'arn:${AWS::Partition}:sqs:${DeployRegion}:${AWS::AccountId}:${StackName}-*'

          - Sid: SchedulesOfTheStack
            Effect: Allow
            Action:
              - events:PutRule
              - events:DeleteRule
              - events:DescribeRule
              - events:EnableRule
              - events:DisableRule
              - events:PutTargets
              - events:RemoveTargets
              - events:TagResource
              - events:UntagResource
              - events:ListTagsForResource
            Resource: !Sub 'arn:${AWS::Partition}:events:${DeployRegion}:${AWS::AccountId}:rule/${StackName}-*'

          - Sid: LogGroupsOfTheStack
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:PutRetentionPolicy
              - logs:DeleteRetentionPolicy
              - logs:TagResource
              - logs:UntagResource
              - logs:ListTagsForResource
              - logs:PutMetricFilter
              - logs:DeleteMetricFilter
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${DeployRegion}:${AWS::AccountId}:log-group:/aws/lambda/${StackName}-*'
              - !Sub 'arn:${AWS::Partition}:logs:${DeployRegion}:${AWS::AccountId}:log-group:/aws/lambda/${StackName}-*:*'

          - Sid: LogsReadNoResourceScope
            Effect: Allow
            Action:
              - logs:DescribeLogGroups
              - logs:DescribeMetricFilters
            Resource: '*'

          - Sid: AlarmsOfTheStack
            Effect: Allow
            Action:
              - cloudwatch:PutMetricAlarm
              - cloudwatch:DeleteAlarms
              - cloudwatch:TagResource
              - cloudwatch:UntagResource
              - cloudwatch:ListTagsForResource
            Resource: !Sub 'arn:${AWS::Partition}:cloudwatch:${DeployRegion}:${AWS::AccountId}:alarm:${StackName}-*'

          - Sid: AlarmsReadNoResourceScope
            Effect: Allow
            Action: cloudwatch:DescribeAlarms
            Resource: '*'

          - Sid: AlertTopicOfTheStack
            Effect: Allow
            Action:
              - sns:CreateTopic
              - sns:DeleteTopic
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:Subscribe
              - sns:Unsubscribe
              - sns:ListSubscriptionsByTopic
              - sns:GetSubscriptionAttributes
              - sns:TagResource
              - sns:UntagResource
              - sns:ListTagsForResource
            Resource: !Sub 'arn:${AWS::Partition}:sns:${DeployRegion}:${AWS::AccountId}:${StackName}-*'

  # --------------------------------------------------------- mode: user (access key)
  DeployUser:
    Type: AWS::IAM::User
    Condition: UseUser
    Properties:
      UserName: !Sub 'github-actions-deploy-${StackName}'
      ManagedPolicyArns:
        - !Ref DeployPolicyPlatform
        - !Ref DeployPolicyResources

  # --------------------------------------------------------- mode: oidc (no stored keys)
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  DeployRole:
    Type: AWS::IAM::Role
    Condition: UseOidc
    Properties:
      RoleName: !Sub 'github-actions-deploy-${StackName}'
      Description: Assumed by GitHub Actions to deploy the application stack.
      MaxSessionDuration: 3600
      ManagedPolicyArns:
        - !Ref DeployPolicyPlatform
        - !Ref DeployPolicyResources
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Only THIS repository, and only the production environment or the main branch.
              # (A job that uses `environment: production` presents the environment form.)
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubOwner}/${GitHubRepository}:environment:production'
                  - !Sub 'repo:${GitHubOwner}/${GitHubRepository}:ref:refs/heads/main'

Outputs:
  DeployUserName:
    Condition: UseUser
    Description: >
      Next, in IAM -> Users -> this user -> Security credentials -> Create access key ("Application running
      outside AWS"), then store the two values as the GitHub secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
    Value: !Ref DeployUser
  DeployRoleArn:
    Condition: UseOidc
    Description: Store this as the AWS_ROLE_ARN secret in the GitHub repository (Environment "production").
    Value: !GetAtt DeployRole.Arn
